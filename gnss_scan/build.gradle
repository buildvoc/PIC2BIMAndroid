apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    compileSdk 34
    namespace 'eu.foxcom.gnss_scan'
    build {};

    defaultConfig {
        minSdkVersion 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation project(path: ':convex_hull')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'com.google.android.gms:play-services-location:19.0.1'
}

afterEvaluate {
    publishing {
        repositories {
            maven {
                name = 'foxRepo'
                url = "file://${rootProject.layout.buildDirectory}/repo"
            }
        }

        publications {
            def def_groupId = 'eu.foxcom.gnss_scan'
            def def_artifactId = 'gnss_scan'
            def def_version = '1.0';

            release(MavenPublication) {
                from components.findByName('release')

                groupId = def_groupId
                artifactId = def_artifactId
                version = def_version
            }

            debug(MavenPublication) {
                from components.findByName('debug')

                groupId = def_groupId
                artifactId = def_artifactId
                version = def_version
            }
        }
    }
}